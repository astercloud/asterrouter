name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: asterrouter_test
          POSTGRES_USER: asterrouter
          POSTGRES_PASSWORD: asterrouter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asterrouter -d asterrouter_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ASTER_TEST_DATABASE_URL: postgres://asterrouter:asterrouter@127.0.0.1:5432/asterrouter_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check formatting
        working-directory: backend
        run: test -z "$(gofmt -l .)"
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Verify PostgreSQL 16 baseline
        env:
          PGPASSWORD: asterrouter
        run: |
          set -euo pipefail
          server_version_num="$(psql --host=127.0.0.1 --username=asterrouter --dbname=asterrouter_test --tuples-only --no-align --command='SHOW server_version_num')"
          test "$((server_version_num / 10000))" -eq 16
          printf 'postgresql_major=16\n'
      - name: Tests with PostgreSQL and coverage
        working-directory: backend
        run: go test -covermode=atomic -coverprofile=coverage.out ./...
      - name: Dual-service gateway soak harness
        working-directory: backend
        env:
          ASTER_GATEWAY_SOAK: '1'
          ASTER_GATEWAY_SOAK_DURATION: 3s
          ASTER_GATEWAY_SOAK_INTERVAL: 10ms
        run: go test -count=1 -run '^TestGatewayNormalAndStreamingSoak$' ./internal/server
      - name: Plugin trust-chain journey
        working-directory: backend
        run: |
          set -o pipefail
          go test -json -count=1 -timeout=60s ./internal/plugins \
            -run '^(TestPluginTrustChainCatalogToSidecarFeed|TestServiceSyncOfficialCatalogRejectsTamperedPayload|TestServiceDownloadOfficialPackageRejectsChecksumMismatch|TestOfficialFeedImportRejectsTamperedCiphertextAndRollback|TestOfficialFeedImportAppliesRevocationsAndFallsBackToUsableCache|TestServiceSyncOfficialCatalogBlocksRevokedAdvisoryVersion|TestInstallPackageRollsBackActiveDirectoryWhenRepositoryWriteFails)$' \
            | tee "${{ runner.temp }}/plugin-trust-chain.json"
      - name: Gateway failure matrix
        env:
          ASTER_GATEWAY_FAILURE_MATRIX_OUTPUT: ${{ runner.temp }}/gateway-failure-matrix.json
        run: node scripts/gateway-failure-matrix.mjs
      - name: Upload backend coverage
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.out
          if-no-files-found: error
      - name: Upload plugin trust-chain evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-trust-chain-evidence
          path: ${{ runner.temp }}/plugin-trust-chain.json
          if-no-files-found: error
      - name: Upload gateway failure matrix
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gateway-failure-matrix
          path: ${{ runner.temp }}/gateway-failure-matrix.json
          if-no-files-found: error

  recovery:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: asterrouter_recovery_test
          POSTGRES_USER: asterrouter
          POSTGRES_PASSWORD: asterrouter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asterrouter -d asterrouter_recovery_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: PostgreSQL backup and empty-database restore rehearsal
        working-directory: backend
        env:
          ASTER_RECOVERY_TEST_DATABASE_URL: postgres://asterrouter:asterrouter@127.0.0.1:5432/asterrouter_recovery_test?sslmode=disable
          ASTER_RECOVERY_TEST_ALLOW_DESTRUCTIVE: '1'
        run: |
          set -o pipefail
          go test -json -count=1 -run '^TestPostgresBackupRestoreRehearsal$' ./internal/system | tee "${{ runner.temp }}/recovery-test.json"
          grep -Eq '"Action":"pass".*"Test":"TestPostgresBackupRestoreRehearsal"' "${{ runner.temp }}/recovery-test.json"
      - name: Validate current runtime schema and migration snapshots
        working-directory: backend
        env:
          ASTER_TEST_DATABASE_URL: postgres://asterrouter:asterrouter@127.0.0.1:5432/asterrouter_recovery_test?sslmode=disable
        run: |
          set -o pipefail
          go test -json -count=1 -run '^(TestMigrationSnapshotsApplyToRuntimePostgres|TestRuntimeSchemaMatchesMigrationSnapshots)$' ./migrations | tee "${{ runner.temp }}/migration-schema-test.json"
          grep -Eq '"Action":"pass".*"Test":"TestMigrationSnapshotsApplyToRuntimePostgres"' "${{ runner.temp }}/migration-schema-test.json"
          grep -Eq '"Action":"pass".*"Test":"TestRuntimeSchemaMatchesMigrationSnapshots"' "${{ runner.temp }}/migration-schema-test.json"
      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postgres-recovery-evidence
          path: |
            ${{ runner.temp }}/recovery-test.json
            ${{ runner.temp }}/migration-schema-test.json
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Check public documentation links
        working-directory: frontend
        run: npm run check:public-doc-links
      - name: Check workflow pipeline failure propagation
        working-directory: frontend
        run: npm run check:workflow-pipefail
      - name: Check Enterprise surface
        working-directory: frontend
        run: npm run check:enterprise-surface
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Unit and component tests
        working-directory: frontend
        run: npm run test:unit:coverage
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Upload frontend coverage
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: asterrouter_e2e_test
          POSTGRES_USER: asterrouter
          POSTGRES_PASSWORD: asterrouter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asterrouter -d asterrouter_e2e_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ASTERROUTER_SERVER_STORAGE_DATABASE_URL: postgres://asterrouter:asterrouter@127.0.0.1:5432/asterrouter_e2e_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        working-directory: frontend
        run: npm run test:e2e:smoke
      - name: Create isolated first-install database
        env:
          PGPASSWORD: asterrouter
        run: >-
          psql --host=127.0.0.1 --username=asterrouter --dbname=postgres
          --command='CREATE DATABASE asterrouter_e2e_setup_test'
      - name: First-install setup browser journey
        env:
          ASTER_SETUP_JOURNEY_DIR: ${{ runner.temp }}/asterrouter-setup-journey
          ASTER_SETUP_JOURNEY_DATABASE_URL: postgres://asterrouter:asterrouter@127.0.0.1:5432/asterrouter_e2e_setup_test?sslmode=disable
        run: bash scripts/test-setup-browser-journey.sh
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
            ${{ runner.temp }}/asterrouter-setup-journey/report.txt
            ${{ runner.temp }}/asterrouter-setup-journey/runtime.log
            ${{ runner.temp }}/asterrouter-setup-journey/playwright
          if-no-files-found: ignore

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run release container acceptance
        env:
          ASTER_TEST_ARTIFACT_DIR: ${{ runner.temp }}/asterrouter-container-evidence
        run: bash scripts/test-container.sh
      - name: Run HA container failover acceptance
        env:
          ASTER_HA_TEST_ARTIFACT_DIR: ${{ runner.temp }}/asterrouter-ha-container-evidence
        run: |
          bash scripts/test-ha-container.sh
          grep -Fxq 'ha_container_acceptance=passed' "${{ runner.temp }}/asterrouter-ha-container-evidence/report.txt"
      - name: Upload container evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-evidence
          path: |
            ${{ runner.temp }}/asterrouter-container-evidence
            ${{ runner.temp }}/asterrouter-ha-container-evidence
          if-no-files-found: ignore

  ha-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate HA Compose expansion
        env:
          ASTERROUTER_DATABASE_URL: postgres://example.invalid/asterrouter
          ASTERROUTER_SECRET_KEY: ci-only-ha-config-secret
        run: docker compose -f deploy/docker-compose.ha.yml config --quiet
      - name: Validate Nginx proxy configuration
        run: |
          docker run --rm \
            --add-host asterrouter-a:127.0.0.1 \
            --add-host asterrouter-b:127.0.0.1 \
            -v "$PWD/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/deploy/nginx/asterrouter-ha.conf:/etc/nginx/asterrouter-ha.conf:ro" \
            nginx:1.29-alpine nginx -t -c /etc/nginx/nginx.conf
      - name: Validate Prometheus scrape config and alert rules
        run: |
          metrics_secret="${RUNNER_TEMP}/asterrouter-metrics-token"
          printf '%s' 'ci-only-metrics-token' > "${metrics_secret}"
          docker run --rm \
            -v "$PWD/deploy/prometheus/prometheus.example.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/deploy/prometheus/alerts.yml:/etc/prometheus/rules/alerts.yml:ro" \
            -v "${metrics_secret}:/run/secrets/asterrouter_metrics_token:ro" \
            --entrypoint /bin/promtool \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm \
            -v "$PWD/deploy/prometheus:/etc/prometheus/rules:ro" \
            -w /etc/prometheus/rules \
            --entrypoint /bin/promtool \
            prom/prometheus:v3.5.0 test rules alerts_test.yml
